# Site settings
title: "Dr. Malvika Tejura - Resume"
description: "Resume for Dr. Malvika Tejura"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Dr. Malvika Tejura"
resume_title:                   "PhD in Genome Sciences"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "malvika.tejura20@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         ""

resume_header_contact_info:     "742 Evergreen Terrace, Springfield • 555-7334 • lisasimpson@youremailaddress.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>I am a newly minted PhD in Genome Sciences from the University of Washington, where I led large-scale efforts to integrate functional assay data and computational predictors to improve clinical variant interpretation. My doctoral work focused on harmonizing multiplexed assays of variant effect, calibrating predictive models, and building scalable, reproducible frameworks to resolve variants of uncertain significance at scale. <br/><br/>As I transition from academia, my immediate goal is to move into AI/ML roles in healthcare and biological safety, applying my expertise in model evaluation, data integration, and translational genomics to develop robust, high-impact systems at the intersection of modern biology and advanced machine learning.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
