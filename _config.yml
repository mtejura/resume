# Site settings
title: "Dr. Malvika Tejura - Resume"
description: "Resume for Dr. Malvika Tejura"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Malvika Tejura (PhD)"
resume_title:                   "PhD in Genome Sciences"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "malvika.tejura20@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         ""

resume_header_contact_info:     "address • phone • email"
display_header_contact_info:    "false"

resume_header_intro: "<p>I earned my PhD in Genome Sciences from the University of Washington, where I served as a scientific leader within the IGVF consortium's Coding Variants Focus Group (CVFG). I led large-scale efforts to integrate high throughput functional assay data with computational prediction models to advance clinical variant interpretation. My work focused on building scalable, reproducible frameworks for resolving variants of uncertain significance. <br/><br/>Through this work, I developed deep expertise in model evaluation under real-world uncertainty, aligning predictive outputs with domain-grounded truth sets, and constructing data pipelines capable of operating at scale. I am now seeking AI/ML roles in healthcare and biological safety, where I can apply this experience to develop robust, interpretable systems that are reliable in high-impact clinical and scientific settings.</p>"

