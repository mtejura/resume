- company: Shoreline Community College
  position: Guest Lecturer
  duration: Mar, 2023
  summary: As a leader for the DEI committee initiative to increase Genome Sciences affiliations with community colleges in the area, I coordinated and gave a guest lecture on Next-generation sequencing to a biotechnology class at Shoreline CC with two other graduate students. After the lecture, there was a Q&A session where students could ask about general research, my path to graduate school, or opportunities for research at Genome Sciences.

