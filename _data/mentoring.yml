- company: University of California, Berkeley
  position: MCB Transfer Mentor
  duration: Aug, 2017 &mdash; Dec, 2017
  summary: After reflecting on my challenging journey as a transfer, I joined the MCB (Molecular Cell Biology) Transfer Mentor Program at UC Berkeley, where I helped incoming transfers acclimate to the university and guided them on class selection.  Specifically, I mentored Rio Marielle Malana, Dang Nguyen, and Joshua Moo Garcia. The Transfer Mentor Program consisted of weekly meetings with an MCB advisor, where I learned how to approach questions and concerns that could be posed by my mentees. I also had one-on-one check-ins with my mentees to learn more about their first-semester experience and support them in any challenges they might face. I continued my mentoring with some of my mentees beyond the program dates.